<!DOCTYPE html>
<html>
<head>
	<!-- Required meta tags -->
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
	
	<title>NumJudgResult</title>
		
	<!--CSS読み込み-->
	<link rel="stylesheet" th:href="@{/css/numJudg.css}">

</head>
<body>
	<div  class="text-center form-Numjudg">
		<h1  class="h1 mt-5">結果画面</h1>
		<br />
		<table th:object="${numJudgForm}" class="table mx-auto">
			<tr>
				<td>入力値：</td>
				<td th:text="*{inputNum}"></td>
			</tr>
			<tr>
				<td>判定結果：</td>
				<td th:text="*{result}"></td>
			</tr>
		</table>
		<form method="post" th:action="@{/home}" >
			<input type="submit" th:value="数値入力に戻る" class="btn btn-primary mt-3"/>
		</form>
		<br />
		<div>
			<table class="table table-striped table-borderd table-hover  mt-3">
				<thead>
					<tr>
						<th></th>
						<th>入力値</th>
						<th>判定結果</th>
					</tr>
				</thead>
				<tbody >
					<tr th:each="item:${numList}">
						<td>
							<form method="post" th:action="@{/judg}">
								<input type="hidden" th:name="inputNum"  th:value="${item.inputNum}">
<!--								<input type="submit" th:value="${item.inputNum}">-->
								<button class="btn btn-light btn-sm">再判定</button>
							</form>
						</td>
						<td th:text="${item.inputNum}"></td>
						<td th:text="${item.result}"></td>
					</tr>
				</tbody>
			</table>
			
		</div>
	</div>
	
 	<!-- Optional JavaScript -->
 	<!-- jQuery first, then Popper.js, then Bootstrap JS -->
 	<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
 	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
 	<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
</body>
</html>
